    * {

      padding: 0;
      font-family: 'Share Tech Mono', monospace, monospace;
    }

    body {
      background-color: #0d120d;

    /* الشريط العلوي الأسود */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #000;
      color: #00ff41;
      text-align: center;
      font-size: 12px;

      z-index: 10;

    }

    /* الحاوية الرئيسية الداكنة */
    .main-card {
      background-color: rgba(10, 15, 10, 0.95);
      border: 2px solid #00ff41;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.4), inset 0 0 15px rgba(0, 255, 65, 0.2);
      width: 100%;
      max-width: 650px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    /* العنوان الرئيسي */
    .title {
      color: #00ff41;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
      letter-spacing: 2px;
      text-align: center;
      direction: ltr;
    }

    /* خط فاصل مع أيقونة البرق */
    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 5px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: #00ff41;
      box-shadow: 0 0 5px #00ff41;
    }

    .lightning-box {
      background-color: #000;
      border: 1px solid #00ff41;
      padding: 2px 8px;
      margin: 0 10px;
      border-radius: 4px;
      color: #00ff41;
      font-size: 14px;
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
    }

    /* الصناديق الداخلية */
    .inner-box {
      width: 100%;
      border: 1px solid #00ff41;
      border-radius: 8px;
      background-color: rgba(0, 15, 0, 0.6);
      padding: 15px;
      box-shadow: inset 0 0 8px rgba(0, 255, 65, 0.3);
      font-size: 14px;
      line-height: 1.6;
    }

    .box-1 {
      direction: ltr;
      text-align: left;
    }

    .box-2 {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* أزرار ورابط الديسكورد */
    .discord-btn {
      display: inline-block;
      border: 1px solid #00ff41;
      border-radius: 20px;
      padding: 6px 18px;
      color: #00ff41;
      text-decoration: none;
      background-color: transparent;
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
      transition: all 0.2s ease;
      direction: ltr;
    }

    .discord-btn:hover {
      background-color: #00ff41;
      color: #000;
      box-shadow: 0 0 15px #00ff41;
    }

    .center-text {
      text-align: center;
    }

    .ltr-text {
      direction: ltr;
      text-align: left;
    }
  </style>
